<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สแกนใบหน้า</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
  <style>
    /* CSS เดิมทั้งหมด (คงไว้เหมือนเดิม) */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Prompt', sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #emptyPage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #emptyPage .lock-icon { font-size: 4rem; opacity: 0.1; }
    #emptyPage .wait-text { margin-top: 10px; font-size: 1rem; color: #555; }

    #scanPage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      position: relative;
    }

    #colorFlashOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      z-index: 100;
      pointer-events: none;
      transition: all 0.15s ease;
    }

    .scan-header { text-align: center; margin-bottom: 12px; z-index: 101; }
    .scan-subtitle { font-size: 0.95rem; color: #9ca3af; margin-top: 4px; }

    #faceScanInstruction {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
      margin-bottom: 20px;
      min-height: 2rem;
      z-index: 101;
      transition: color 0.3s ease;
      padding: 0 20px;
    }

    /* กล้อง */
    .camera-container {
      position: relative;
      z-index: 101;
      width: 90%;
      max-width: 400px;
      height: 60vh; 
      max-height: 500px;
      border-radius: 24px;
      overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      background: #1a1a1a;
    }

    #faceVideo {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #faceCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      pointer-events: none;
      z-index: 2;
    }

    .steps-row { display: flex; gap: 10px; margin-top: 24px; z-index: 101; }
    .step-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transition: all 0.4s ease;
    }
    .step-dot.active {
      background: #3b82f6;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
      transform: scale(1.3);
    }
    .step-dot.done { background: #10b981; }

    #cancelBtn {
      margin-top: 28px;
      z-index: 101;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 25px;
      padding: 12px 36px;
      font-family: 'Prompt', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #cancelBtn:hover, #cancelBtn:active {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
    }

    /* Result Overlay */
    #resultOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    #resultOverlay.show { display: flex; }

    .success-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background: rgba(16, 185, 129, 0.07);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 28px;
      padding: 32px 24px;
      margin-bottom: 28px;
      width: 90%;
      max-width: 320px;
      animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .user-photo-frame {
      width: 110px; height: 110px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #10b981;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.5);
      background: #1a1a1a;
    }
    .user-photo-frame img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    .success-info { text-align: center; }
    .success-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      animation: popIn 0.45s 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .success-title { font-size: 1.4rem; font-weight: 700; color: #10b981; line-height: 1.2; }
    .success-sub   { font-size: 0.9rem; color: #9ca3af; margin-top: 8px; }

    #nextBtn {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #fff;
      border-radius: 50px;
      padding: 16px 64px;
      font-family: 'Prompt', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
      animation: fadeUp 0.5s 0.35s both;
      letter-spacing: 0.5px;
    }
    #nextBtn:hover, #nextBtn:active { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(16, 185, 129, 0.55); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .error-icon  { font-size: 4.5rem; margin-bottom: 1rem; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .error-title { font-size: 1.4rem; font-weight: 700; color: #ef4444; }
    .error-sub   { font-size: 0.95rem; color: #9ca3af; margin-top: 8px; }

    @media (max-height: 600px) {
      .camera-container { height: 50vh; }
      #faceScanInstruction { font-size: 1.15rem; margin-bottom: 12px; }
      .user-photo-frame { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>

  <div id="emptyPage">
    <div class="lock-icon">⏳</div>
    <div class="wait-text">รอการเชื่อมต่อ...</div>
  </div>

  <div id="scanPage">
    <div id="colorFlashOverlay"></div>
    <div class="scan-header"><div class="scan-subtitle" id="userLabel"></div></div>
    <div id="faceScanInstruction">กำลังโหลดโมเดล AI...</div>

    <div class="camera-container" id="cameraContainer">
      <video id="faceVideo" autoplay muted playsinline></video>
      <canvas id="faceCanvas"></canvas>
    </div>

    <div class="steps-row" id="stepsRow"></div>
    <button id="cancelBtn" onclick="cancelScan()">ยกเลิก</button>
  </div>

  <div id="resultOverlay"></div>

  <script>
    // ==========================================
    // State
    // ==========================================
    var params           = null;
    var scanMode         = '';
    var savedDesc        = null;
    var adminTargetId    = '';
    var faceModelsLoaded = false;
    var faceVideo, faceCanvas, scanInterval, rafId;
    var livenessActions  = [];
    var currentActionIdx = 0;
    var nodStartY        = 0;
    var isNoddingDown    = false;
    var justPassed       = false;

    // ── Oval state ──
    var ovalColor    = 'white';
    var guidePhase   = 0;
    var faceDetected = false;

    // ==========================================
    // ตัวกลาง (Bridge/Intermediary) - รับค่าจาก Parent
    // ==========================================
    window.addEventListener('message', function (event) {
      var data = event.data;
      if (!data || !data.type) return;

      // เมื่อได้รับคำสั่ง 'START_SCAN' จากหน้าต่างแม่
      if (data.type === 'START_SCAN') {
        setupScanner(data.payload || {});
      } 
      // เมื่อได้รับคำสั่งให้หยุด
      else if (data.type === 'STOP_SCAN') {
        cancelScan();
      }
    });

    // ==========================================
    // Boot
    // ==========================================
    window.addEventListener('load', function () {
      var hash = window.location.hash.slice(1);
      if (hash) {
        try { 
          var decodedParams = JSON.parse(decodeURIComponent(escape(atob(hash)))); 
          setupScanner(decodedParams);
        } catch (e) { show('emptyPage'); }
      } else {
        // หากไม่มี Hash ให้แสดงหน้าจอรอรับคำสั่งผ่าน postMessage (Message Event)
        show('emptyPage'); 
      }
    });

    // ฟังก์ชันสำหรับตั้งค่าพารามิเตอร์เริ่มต้น
    function setupScanner(payloadParams) {
      params = payloadParams;
      scanMode      = params.mode || 'login';
      adminTargetId = params.adminTargetId || '';

      if (params.descriptor) {
        try { savedDesc = new Float32Array(JSON.parse(params.descriptor)); }
        catch (e) { savedDesc = null; }
      }

      if (params.name || adminTargetId) {
        document.getElementById('userLabel').textContent =
          scanMode === 'admin'
            ? 'บันทึกใบหน้า: เลขที่ ' + adminTargetId
            : 'สวัสดี ' + (params.name || '');
      }

      show('scanPage');
      initScan();
    }

    function show(id) {
      ['emptyPage', 'scanPage'].forEach(function (p) {
        document.getElementById(p).style.display = 'none';
      });
      document.getElementById(id).style.display = 'flex';
    }

    async function loadFaceModels() {
      if (faceModelsLoaded) return;
      var MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
        faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
      ]);
      faceModelsLoaded = true;
    }

    async function initScan() {
      setInstruction('กำลังเปิดกล้อง...');
      await loadFaceModels();

      faceVideo  = document.getElementById('faceVideo');
      faceCanvas = document.getElementById('faceCanvas');

      try {
        var stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 1280 } } 
        });
        faceVideo.srcObject = stream;
      } catch (err) {
        sendResult({ success: false, error: 'CAMERA_DENIED' });
        showErrorResult('❌', 'ไม่สามารถเข้าถึงกล้องได้', 'กรุณาอนุญาตสิทธิ์กล้อง');
        return;
      }

      faceVideo.onplay = function () {
        faceCanvas.width  = faceVideo.videoWidth;
        faceCanvas.height = faceVideo.videoHeight;

        var allActions   = ['left', 'right', 'nod', 'smile'];
        livenessActions  = allActions.sort(function () { return Math.random() - 0.5; });
        currentActionIdx = 0;
        nodStartY = 0; isNoddingDown = false; justPassed = false;

        buildStepDots();
        promptNextAction();
        startOvalLoop();

        // Detection loop
        scanInterval = setInterval(async function () {
          if (faceCanvas.width !== faceVideo.videoWidth && faceVideo.videoWidth > 0) {
            faceCanvas.width  = faceVideo.videoWidth;
            faceCanvas.height = faceVideo.videoHeight;
          }

          var dets = await faceapi
            .detectAllFaces(faceVideo, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withFaceExpressions();

          // ไม่มีหน้า
          if (dets.length === 0) {
            faceDetected = false;
            ovalColor = 'white';
            return;
          }

          // มีหลายหน้า
          if (dets.length > 1) {
            faceDetected = false;
            ovalColor = '#ef4444';
            if (!justPassed) setInstruction('⚠️ พบมากกว่า 1 ใบหน้า กรุณาอยู่คนเดียวในกล้อง', '#ef4444');
            return;
          }

          // มี 1 หน้า (สภาวะปกติ)
          faceDetected = true;
          if (!justPassed) ovalColor = '#3b82f6';

          checkLiveness(dets[0]);
        }, 150);
      };
    }

    // ==========================================
    // RAF Loop — วาดวงรีอยู่กับที่
    // ==========================================
    function startOvalLoop() {
      if (rafId) cancelAnimationFrame(rafId);

      function frame(ts) {
        if (!faceCanvas || !faceCanvas.getContext) { rafId = requestAnimationFrame(frame); return; }
        var ctx = faceCanvas.getContext('2d');
        ctx.clearRect(0, 0, faceCanvas.width, faceCanvas.height);

        guidePhase = (ts / 1800) % (Math.PI * 2);
        drawFixedOval(ctx, ovalColor);

        rafId = requestAnimationFrame(frame);
      }
      rafId = requestAnimationFrame(frame);
    }

    function drawFixedOval(ctx, color) {
      var pulse = 0.38 + Math.sin(guidePhase) * 0.12;  
      var pScale = 1 + Math.sin(guidePhase * 0.7) * 0.018; 
      var cx = faceCanvas.width  / 2;
      var cy = faceCanvas.height * 0.48;
      var rx = faceCanvas.width  * 0.28 * pScale;
      var ry = faceCanvas.height * 0.40 * pScale;

      ctx.save();
      ctx.setLineDash([12, 10]);
      ctx.lineDashOffset = -(Date.now() / 40);
      
      if (color === 'white') {
        ctx.strokeStyle = 'rgba(255,255,255,' + (pulse * 0.85) + ')';
        ctx.shadowColor = 'rgba(255,255,255,0.4)';
      } else {
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
      }
      
      ctx.lineWidth   = 3;
      ctx.shadowBlur  = 12;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // ==========================================
    // Step dots & Liveness
    // ==========================================
    function buildStepDots() {
      var row = document.getElementById('stepsRow');
      row.innerHTML = '';
      livenessActions.forEach(function (_, i) {
        var d = document.createElement('div');
        d.className = 'step-dot' + (i === 0 ? ' active' : '');
        d.id = 'dot-' + i;
        row.appendChild(d);
      });
    }
    
    function updateDot(idx, state) {
      var el = document.getElementById('dot-' + idx);
      if (el) el.className = 'step-dot ' + state;
    }

    function promptNextAction() {
      if (currentActionIdx >= livenessActions.length) { completeLiveness(); return; }
      var action = livenessActions[currentActionIdx];
      if (action === 'nod') { nodStartY = 0; isNoddingDown = false; }
      var msgMap = {
        left:  'หันหน้าไปทางซ้าย ←',
        right: 'หันหน้าไปทางขวา →',
        nod:   'พยักหน้าลงแล้วกลับขึ้น',
        smile: 'ยิ้มให้เห็นฟัน 😊'
      };
      setInstruction(msgMap[action]);
    }

    function checkLiveness(det) {
      if (currentActionIdx >= livenessActions.length) return;
      var action = livenessActions[currentActionIdx];
      var lm     = det.landmarks;
      var nose   = lm.getNose()[6];
      var jaw    = lm.getJawOutline();
      var distL  = Math.abs(nose.x - jaw[0].x);
      var distR  = Math.abs(jaw[16].x - nose.x);
      var faceW  = jaw[16].x - jaw[0].x;
      var passed = false;

      if      (action === 'left'  && faceW > 0 && distR / faceW < 0.35) passed = true;
      else if (action === 'right' && faceW > 0 && distL / faceW < 0.35) passed = true;
      else if (action === 'smile' && det.expressions.happy > 0.75)       passed = true;
      else if (action === 'nod') {
        var faceH  = Math.abs(jaw[8].y - lm.getNose()[0].y);
        var downTh = faceH * 0.10, upTh = faceH * 0.05;
        if (nodStartY === 0) nodStartY = nose.y;
        if (!isNoddingDown && (nose.y - nodStartY) > downTh) isNoddingDown = true;
        if (isNoddingDown  && (nose.y - nodStartY) < upTh)   passed = true;
      }

      if (passed) {
        justPassed = true;
        ovalColor  = '#10b981'; // เปลี่ยนวงรีเป็นสีเขียว
        setTimeout(function () {
          justPassed = false;
          ovalColor  = '#3b82f6'; // กลับเป็นสีฟ้า
        }, 650);

        updateDot(currentActionIdx, 'done');
        currentActionIdx++;
        if (currentActionIdx < livenessActions.length) updateDot(currentActionIdx, 'active');
        setInstruction('✓ ผ่านแล้ว!', '#10b981');
        setTimeout(promptNextAction, 500);
      }
    }

    // ==========================================
    // Liveness สำเร็จ → ประมวลผล
    // ==========================================
    async function completeLiveness() {
      clearInterval(scanInterval);
      setInstruction('กำลังประมวลผล...');

      var colors  = ['rgba(255,255,255,0.8)', 'rgba(255,255,255,0.0)'];
      var overlay = document.getElementById('colorFlashOverlay');
      for (var c of colors) {
        overlay.style.backgroundColor = c;
        overlay.style.opacity = '1';
        await new Promise(function (r) { setTimeout(r, 150); });
      }
      overlay.style.opacity = '0';

      var det = await faceapi
        .detectSingleFace(faceVideo, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (!det) {
        setInstruction('หลุดเฟรม กรุณาลองใหม่', '#ef4444');
        setTimeout(restartScan, 1500);
        return;
      }

      var photoUrl = capturePhoto();
      stopCamera();

      if (scanMode === 'admin') {
        showSuccessResult(photoUrl, 'ทำรายการสำเร็จ', 'บันทึกใบหน้าเรียบร้อยแล้ว');
        sendResult({ success: true, mode: 'admin', adminTargetId: adminTargetId, descriptor: JSON.stringify(Array.from(det.descriptor)) });
        return;
      }

      if (!savedDesc) {
        showErrorResult('❌', 'ยังไม่ได้ลงทะเบียนใบหน้า', 'กรุณาใช้ OTP แทน');
        sendResult({ success: false, error: 'NO_DESCRIPTOR' });
        return;
      }

      var distance = faceapi.euclideanDistance(det.descriptor, savedDesc);
      if (distance < 0.5) {
        showSuccessResult(photoUrl, 'ทำรายการสำเร็จ', 'ยืนยันตัวตนเรียบร้อยแล้ว');
        sendResult({ success: true, mode: 'login', distance: distance });
      } else {
        showErrorResult('❌', 'ใบหน้าไม่ตรงกัน', 'กรุณาลองใหม่');
        sendResult({ success: false, error: 'FACE_MISMATCH', distance: distance });
        setTimeout(function () {
          document.getElementById('resultOverlay').classList.remove('show');
          restartScan();
        }, 2500);
      }
    }

    // ==========================================
    // Utils
    // ==========================================
    function capturePhoto() {
      var cap = document.createElement('canvas');
      cap.width = faceVideo.videoWidth;
      cap.height = faceVideo.videoHeight;
      var ctx = cap.getContext('2d');
      ctx.translate(cap.width, 0); ctx.scale(-1, 1);
      ctx.drawImage(faceVideo, 0, 0);
      return cap.toDataURL('image/jpeg', 0.85);
    }

    function showSuccessResult(photoUrl, title, sub) {
      var o = document.getElementById('resultOverlay');
      o.innerHTML =
        '<div class="success-card">' +
          '<div class="user-photo-frame"><img src="' + photoUrl + '" alt="ภาพใบหน้า"></div>' +
          '<div class="success-info">' +
            '<div class="success-icon">✅</div>' +
            '<div class="success-title">' + title + '</div>' +
            '<div class="success-sub">'   + sub   + '</div>' +
          '</div>' +
        '</div>' +
        '<button id="nextBtn" onclick="handleNext()">ต่อไป &nbsp;→</button>';
      o.classList.add('show');
    }

    function showErrorResult(icon, text, sub) {
      var o = document.getElementById('resultOverlay');
      o.innerHTML = '<div class="error-icon">' + icon + '</div><div class="error-title">' + text + '</div><div class="error-sub">' + sub + '</div>';
      o.classList.add('show');
    }

    function handleNext() { window.close(); }

    function setInstruction(text, color) {
      var el = document.getElementById('faceScanInstruction');
      el.textContent = text;
      el.style.color = color || '#fff';
    }

    function stopCamera() {
      clearInterval(scanInterval);
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      if (faceVideo && faceVideo.srcObject)
        faceVideo.srcObject.getTracks().forEach(function (t) { t.stop(); });
    }

    function restartScan() {
      stopCamera();
      var ctx = faceCanvas && faceCanvas.getContext('2d');
      if (ctx) ctx.clearRect(0, 0, faceCanvas.width, faceCanvas.height);
      faceDetected = false;
      ovalColor = 'white';
      initScan();
    }

    function cancelScan() {
      stopCamera();
      sendResult({ success: false, error: 'CANCELLED' });
      // ปิดหน้าต่างถ้าเป็นการเปิดแบบ popup
      if (window.opener) window.close();
    }

    // ==========================================
    // ตัวกลาง (Bridge/Intermediary) - ส่งค่ากลับ
    // ==========================================
    function sendResult(payload) {
      var messageObj = { type: 'FACE_SCAN_RESULT', payload: payload };

      // 1. ส่งผ่าน window.opener (กรณีเปิดแบบแท็บใหม่ หรือ Popup)
      if (window.opener) {
        window.opener.postMessage(messageObj, '*');
      }

      // 2. ส่งผ่าน window.parent (กรณีเปิดแบบฝัง iframe ในเว็บแม่)
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(messageObj, '*');
      }

      // 3. เป็นตัวกลางยิง Webhook (กรณีส่งพารามิเตอร์ webhookUrl มาด้วย)
      if (params && params.webhookUrl) {
        fetch(params.webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(err => console.error('Webhook Send Error:', err));
      }
    }
  </script>
</body>
