<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สแกนใบหน้า</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Prompt', sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ===== หน้าว่าง (เข้าเปล่า) ===== */
    #emptyPage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #emptyPage .lock-icon {
      font-size: 4rem;
      opacity: 0.1;
    }

    /* ===== หน้าสแกน ===== */
    #scanPage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      position: relative;
    }

    #colorFlashOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      z-index: 100;
      pointer-events: none;
      transition: all 0.15s ease;
    }

    .scan-header {
      text-align: center;
      margin-bottom: 16px;
      z-index: 101;
    }
    .scan-subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 4px;
    }

    #faceScanInstruction {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
      margin-bottom: 18px;
      min-height: 2rem;
      z-index: 101;
      transition: color 0.3s ease;
    }

    .camera-container {
      position: relative;
      z-index: 101;
      border-radius: 24px;
      overflow: hidden;
      border: 3px solid #3b82f6;
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
      width: 90%;
      max-width: 380px;
      height: 320px;
      background: #111;
    }

    .scan-line {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
      animation: scanLine 2.5s linear infinite;
      z-index: 3;
      pointer-events: none;
    }
    @keyframes scanLine {
      0% { top: 0; opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    #faceVideo {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .steps-row {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      z-index: 101;
    }
    .step-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transition: all 0.4s ease;
    }
    .step-dot.active {
      background: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
      transform: scale(1.3);
    }
    .step-dot.done { background: #10b981; }

    #cancelBtn {
      margin-top: 24px;
      z-index: 101;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 20px;
      padding: 10px 32px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #cancelBtn:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
    }

    /* result overlay */
    #resultOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #resultOverlay.show { display: flex; }
    .result-icon {
      font-size: 5rem;
      margin-bottom: 1rem;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .result-text { font-size: 1.4rem; font-weight: 700; }
    .result-sub  { font-size: 0.9rem; color: #9ca3af; margin-top: 8px; }

    @media (max-height: 600px) {
      .camera-container { height: 260px; }
      #faceScanInstruction { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <!-- หน้าว่าง (เข้าเปล่า / hash ไม่ถูกต้อง) -->
  <div id="emptyPage">
    <div class="lock-icon">🔒</div>
  </div>

  <!-- หน้าสแกน -->
  <div id="scanPage">
    <div id="colorFlashOverlay"></div>

    <div class="scan-header">
      <div class="scan-subtitle" id="userLabel"></div>
    </div>

    <div id="faceScanInstruction">กำลังโหลดโมเดล AI...</div>

    <div class="camera-container">
      <div class="scan-line"></div>
      <video id="faceVideo" autoplay muted playsinline></video>
    </div>

    <div class="steps-row" id="stepsRow"></div>
    <button id="cancelBtn" onclick="cancelScan()">ยกเลิก</button>
  </div>

  <!-- Result -->
  <div id="resultOverlay">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-text" id="resultText"></div>
    <div class="result-sub"  id="resultSub"></div>
  </div>

  <script>
    // ==========================================
    // อ่าน payload จาก URL hash (Base64 JSON)
    // ==========================================
    var params      = null;
    var scanMode    = '';
    var savedDesc   = null;   // Float32Array
    var adminTargetId = '';
    var faceModelsLoaded = false;
    var faceVideo, scanInterval;
    var livenessActions = [], currentActionIdx = 0;
    var blinkCount = 0, eyeOpenStatus = true, nodStartY = 0, isNoddingDown = false;

    window.addEventListener('load', function() {
      var hash = window.location.hash.slice(1); // ตัด '#' ออก

      if (!hash) {
        // เข้าเปล่า → หน้าว่าง
        show('emptyPage');
        return;
      }

      try {
        params = JSON.parse(decodeURIComponent(escape(atob(hash))));
      } catch(e) {
        show('emptyPage');
        return;
      }

      // อ่าน params
      scanMode      = params.mode || 'login';
      adminTargetId = params.adminTargetId || '';

      if (params.descriptor) {
        try { savedDesc = new Float32Array(JSON.parse(params.descriptor)); }
        catch(e) { savedDesc = null; }
      }

      // แสดง label
      if (params.name || adminTargetId) {
        document.getElementById('userLabel').textContent =
          scanMode === 'admin'
            ? 'บันทึกใบหน้า: เลขที่ ' + adminTargetId
            : 'สวัสดี ' + (params.name || '');
      }

      show('scanPage');
      initScan();
    });

    function show(id) {
      ['emptyPage', 'scanPage'].forEach(function(p) {
        document.getElementById(p).style.display = 'none';
      });
      document.getElementById(id).style.display = 'flex';
    }

    // ==========================================
    // โหลดโมเดล AI
    // ==========================================
    async function loadFaceModels() {
      if (faceModelsLoaded) return;
      var MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
        faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
      ]);
      faceModelsLoaded = true;
    }

    // ==========================================
    // เริ่มกล้องและ Liveness
    // ==========================================
    async function initScan() {
      setInstruction('กำลังโหลดกล้องและโมเดล AI...');
      await loadFaceModels();

      faceVideo = document.getElementById('faceVideo');
      try {
        var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        faceVideo.srcObject = stream;
      } catch(err) {
        sendResult({ success: false, error: 'CAMERA_DENIED' });
        showResult('❌', 'ไม่สามารถเข้าถึงกล้องได้', 'กรุณาอนุญาตสิทธิ์กล้อง');
        return;
      }

      faceVideo.onplay = function() {
        var allActions = ['left', 'right', 'nod', 'blink', 'smile'];
        livenessActions = allActions.sort(() => Math.random() - 0.5);
        currentActionIdx = 0; blinkCount = 0; eyeOpenStatus = true;
        nodStartY = 0; isNoddingDown = false;

        buildStepDots();
        promptNextAction();

        scanInterval = setInterval(async function() {
          var det = await faceapi
            .detectSingleFace(faceVideo, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withFaceExpressions()
            .withFaceDescriptor();

          if (det) checkLiveness(det);
          else setInstruction('ไม่พบใบหน้า กรุณาอยู่ในกรอบ');
        }, 150);
      };
    }

    // ==========================================
    // Step dots
    // ==========================================
    function buildStepDots() {
      var row = document.getElementById('stepsRow');
      row.innerHTML = '';
      livenessActions.forEach(function(_, i) {
        var d = document.createElement('div');
        d.className = 'step-dot' + (i === 0 ? ' active' : '');
        d.id = 'dot-' + i;
        row.appendChild(d);
      });
    }
    function updateDot(idx, state) {
      var el = document.getElementById('dot-' + idx);
      if (el) el.className = 'step-dot ' + state;
    }

    // ==========================================
    // Liveness checks
    // ==========================================
    function promptNextAction() {
      if (currentActionIdx >= livenessActions.length) { completeLiveness(); return; }
      var msgMap = {
        left: 'หันหน้าไปทางซ้าย ←',
        right: 'หันหน้าไปทางขวา →',
        nod: 'พยักหน้าช้าๆ',
        blink: 'กระพริบตา 2-3 ครั้ง',
        smile: 'ยิ้มให้เห็นฟัน 😊'
      };
      setInstruction(msgMap[livenessActions[currentActionIdx]]);
      if (livenessActions[currentActionIdx] === 'blink') { blinkCount = 0; eyeOpenStatus = true; }
    }

    function checkLiveness(det) {
      if (currentActionIdx >= livenessActions.length) return;
      var action = livenessActions[currentActionIdx];
      var lm = det.landmarks;
      var nose = lm.getNose()[3];
      var jaw  = lm.getJawOutline();
      var distLeft  = Math.abs(nose.x - jaw[0].x);
      var distRight = Math.abs(jaw[16].x - nose.x);
      var passed = false;

      if (action === 'left')  { if (distLeft  < distRight * 0.5) passed = true; }
      else if (action === 'right') { if (distRight < distLeft  * 0.5) passed = true; }
      else if (action === 'smile') { if (det.expressions.happy > 0.85) passed = true; }
      else if (action === 'nod') {
        if (nodStartY === 0) nodStartY = nose.y;
        if (nose.y - nodStartY > 15) isNoddingDown = true;
        if (isNoddingDown && nodStartY - nose.y > 10) passed = true;
      }
      else if (action === 'blink') {
        var getEAR = function(eye) {
          var v1 = Math.hypot(eye[1].x - eye[5].x, eye[1].y - eye[5].y);
          var v2 = Math.hypot(eye[2].x - eye[4].x, eye[2].y - eye[4].y);
          var h  = Math.hypot(eye[0].x - eye[3].x, eye[0].y - eye[3].y);
          return (v1 + v2) / (2.0 * h);
        };
        var ear = (getEAR(lm.getLeftEye()) + getEAR(lm.getRightEye())) / 2;
        if (ear < 0.22 && eyeOpenStatus)  { blinkCount++; eyeOpenStatus = false; }
        else if (ear >= 0.25) { eyeOpenStatus = true; }
        setInstruction('กระพริบตา (' + blinkCount + '/2)');
        if (blinkCount >= 2) passed = true;
      }

      if (passed) {
        updateDot(currentActionIdx, 'done');
        currentActionIdx++;
        if (currentActionIdx < livenessActions.length) updateDot(currentActionIdx, 'active');
        setInstruction('✓ ผ่านแล้ว!', '#10b981');
        setTimeout(promptNextAction, 500);
      }
    }

    // ==========================================
    // Liveness สำเร็จ → Color Flash → ส่งผล
    // ==========================================
    async function completeLiveness() {
      clearInterval(scanInterval);
      setInstruction('ทดสอบแสงสะท้อน...');

      var colors = ['rgba(255,0,0,0.6)','rgba(0,0,255,0.6)','rgba(255,255,0,0.6)','rgba(0,255,0,0.6)','rgba(128,0,128,0.6)'];
      var overlay = document.getElementById('colorFlashOverlay');
      for (var c of colors) {
        overlay.style.backgroundColor = c;
        overlay.style.opacity = '1';
        await new Promise(r => setTimeout(r, 200));
      }
      overlay.style.opacity = '0';
      setInstruction('กำลังประมวลผลใบหน้า...');

      var det = await faceapi
        .detectSingleFace(faceVideo, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (!det) {
        setInstruction('หลุดเฟรม กรุณาลองใหม่', '#ef4444');
        setTimeout(restartScan, 1500);
        return;
      }

      stopCamera();

      if (scanMode === 'admin') {
        showResult('✅', 'บันทึกใบหน้าสำเร็จ', 'ปิดหน้าต่างนี้ได้เลย');
        sendResult({
          success: true,
          mode: 'admin',
          adminTargetId: adminTargetId,
          descriptor: JSON.stringify(Array.from(det.descriptor))
        });

      } else {
        if (!savedDesc) {
          showResult('❌', 'ยังไม่ได้ลงทะเบียนใบหน้า', 'กรุณาใช้ OTP แทน');
          sendResult({ success: false, error: 'NO_DESCRIPTOR' });
          return;
        }
        var distance = faceapi.euclideanDistance(det.descriptor, savedDesc);
        if (distance < 0.5) {
          showResult('✅', 'ยืนยันตัวตนสำเร็จ', 'กำลังเข้าสู่ระบบ...');
          sendResult({ success: true, mode: 'login', distance: distance });
        } else {
          showResult('❌', 'ใบหน้าไม่ตรงกัน', 'กรุณาลองใหม่');
          sendResult({ success: false, error: 'FACE_MISMATCH', distance: distance });
        }
      }
    }

    // ==========================================
    // Utils
    // ==========================================
    function setInstruction(text, color) {
      var el = document.getElementById('faceScanInstruction');
      el.textContent = text;
      el.style.color = color || '#fff';
    }

    function stopCamera() {
      clearInterval(scanInterval);
      if (faceVideo && faceVideo.srcObject)
        faceVideo.srcObject.getTracks().forEach(function(t) { t.stop(); });
    }

    function restartScan() { stopCamera(); initScan(); }

    function cancelScan() {
      stopCamera();
      sendResult({ success: false, error: 'CANCELLED' });
      window.close();
    }

    function showResult(icon, text, sub) {
      document.getElementById('resultIcon').textContent = icon;
      document.getElementById('resultText').textContent = text;
      document.getElementById('resultSub').textContent  = sub;
      document.getElementById('resultOverlay').classList.add('show');
      setTimeout(function() { window.close(); }, 2500);
    }

    // ส่งผลกลับหน้าหลัก (Apps Script)
    function sendResult(payload) {
      if (window.opener) {
        window.opener.postMessage({ type: 'FACE_SCAN_RESULT', payload: payload }, '*');
      }
    }
  </script>
</body>
</html>
